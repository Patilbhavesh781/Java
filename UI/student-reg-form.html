<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/student-reg-form.css">
</head>
<body>
    <div class="box">
        <h2>Student Registration Form</h2>
        <div class="form-data">
            <form action="">
                <table>
                    <tr>
                        <td class="label-text"><label for="fname">First Name</label></td>
                        <td><input type="text" id="fname" name="fname" placeholder="Enter First Name" > <span class="validation">(max 30 characters allowed)</span></td>
                    </tr>
                    <tr>
                        <td class="label-text"><label for="lname">Last Name</label></td>
                        <td><input type="text" id="lname" name="lname" placeholder="Enter Last Name" > <span class="validation">(max 30 characters allowed)</span></td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
</html>
