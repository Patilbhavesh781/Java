<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lan's TimeTable</title>
</head>
<style>
    .container{
        width: 80%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        margin:auto;
    }
    table, td, th{
        border: 2px solid grey;
    }
    thead{
        font-weight: bold;
    }
</style>
<body>
    <div class="container">
        <h3>Lan's TimeTable </h3>
        <table>
            <thead>
                <tr>
                    <th>Time/Days</th>
                    <td>Monday</td>
                    <td>Tuesday</td>
                    <td>Wednesday</td>
                    <td>Thursday</td>
                    <td>Friday</td>
                    <td>Saturday</td>
                </tr>
            </thead>
            <tbody>
                
                <tr>
                    <th>12:00pm - 12:45pm</th>
                    <td>Sanskrit</td>
                    <td>Sanskrit</td>
                    <td>Sanskrit</td>
                    <td>Sanskrit</td>
                    <td>Sanskrit</td>
                    <td>Sanskrit</td>
                </tr>
                <tr>
                    <th>12:45pm - 1:30pm</th>
                    <td>Marathi</td>
                    <td>P.T.</td>
                    <td>English</td>
                    <td>Maths</td>
                    <td>Marathi</td>
                    <td>History</td>
                </tr>
                <tr>
                    <th>1:30pm - 2:15pm</th>
                    <td>Science</td>
                    <td>History</td>
                    <td>Geography</td>
                    <td>Maths</td>
                    <td>English</td>
                    <td>P.T.</td>
                </tr>
                <tr>
                    <th>2:15pm - 2:45pm</th>
                    <th colspan="6">LUNCH BREAK</th>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
