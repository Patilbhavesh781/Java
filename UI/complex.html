<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex TimeTable</title>
</head>
<style>
    .container {
        width: 80%;
        margin: auto;
        display: flex;
        justify-content: center;
    }

    table,
    td {
        border: 2px solid black;
        text-align: center;
        border-collapse: collapse;
    }

    thead {
        font-weight: bold;
    }
</style>

<body>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <td rowspan="3">Day</td>
                    <td colspan="3">Seminar</td>
                </tr>
                <tr>
                    <td colspan="2">Schedule</td>
                    <td rowspan="2">Topic</td>
                </tr>
                <tr>
                    <td>Begin</td>
                    <td>End</td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2">Monday</td>
                    <td rowspan="2">8:00am</td>
                    <td rowspan="2">5:00pm</td>
                    <td>Introduction to XML</td>
                </tr>
                <tr>
                    <td>Validity: DTD and Relax NG</td>
                </tr>
                <tr>
                    <td rowspan="3">Tuesday</td>
                    <td>8:00am</td>
                    <td>11:00am</td>
                    <td>XPath</td>
                </tr>
                <tr>
                    <td>11:00am</td>
                    <td>2:00pm</td>
                    <td rowspan="2">XLS Transformations</td>
                </tr>
                <tr>
                    <td>2:00pm</td>
                    <td>5:00pm</td>
                </tr>
                <tr>
                    <td>Wednesday</td>
                    <td>8:00am</td>
                    <td>12:00pm</td>
                    <td>XLS Formatting Objects</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
